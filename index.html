<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>          
<script>
  window.TelegramAdsController = new TelegramAdsController();
  window.TelegramAdsController.initialize({
    pubId: "1018738",
    appId: "8322",
  });
</script>
<title>🎡 Crypto Spin Wheel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(135deg,#0b0e14 0%,#1a1f2e 100%);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Segoe UI',Arial,sans-serif;
  padding:20px;
}
.container{
  background:#111a24;
  border-radius:24px;
  padding:30px;
  max-width:600px;
  width:100%;
  border:1px solid #1f2a36;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}
h1{
  text-align:center;
  color:#f7931a;
  font-size:28px;
  font-weight:800;
  margin-bottom:5px;
  letter-spacing:1px;
}
.sub{
  text-align:center;
  color:#8896a8;
  font-size:14px;
  margin-bottom:20px;
}
.wheel-wrapper{
  position:relative;
  width:100%;
  max-width:400px;
  margin:0 auto;
}
canvas{
  width:100%;
  height:auto;
  display:block;
  border-radius:50%;
  box-shadow:0 0 40px rgba(247,147,26,0.15),inset 0 0 40px rgba(0,0,0,0.3);
  cursor:pointer;
  transition:0.3s;
}
canvas:hover{box-shadow:0 0 60px rgba(247,147,26,0.25),inset 0 0 40px rgba(0,0,0,0.3)}
.pointer{
  position:absolute;
  top:-12px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:20px solid transparent;
  border-right:20px solid transparent;
  border-top:30px solid #f7931a;
  filter:drop-shadow(0 4px 10px rgba(247,147,26,0.5));
  z-index:10;
}
.controls{
  display:flex;
  gap:12px;
  margin-top:25px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  padding:12px 32px;
  border:none;
  border-radius:40px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.btn-spin{
  background:linear-gradient(135deg,#f7931a,#ffb347);
  color:#0b0e14;
  box-shadow:0 4px 20px rgba(247,147,26,0.3);
}
.btn-spin:hover{transform:scale(1.03);box-shadow:0 6px 30px rgba(247,147,26,0.4)}
.btn-spin:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-reset{
  background:#1e2632;
  color:#b0c4d8;
  border:1px solid #2a3340;
}
.btn-reset:hover{background:#2a3340;transform:scale(1.02)}
.result-box{
  margin-top:20px;
  padding:16px 20px;
  background:#141b24;
  border-radius:14px;
  border:1px solid #1f2a36;
  text-align:center;
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
.result-text{
  font-size:22px;
  font-weight:700;
  color:#f7931a;
}
.result-sub{
  font-size:13px;
  color:#6f7e90;
  margin-top:4px;
}
.history{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:10px;
}
.history span{
  background:#1e2632;
  color:#b0c4d8;
  padding:3px 12px;
  border-radius:20px;
  font-size:12px;
  border:1px solid #2a3340;
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:0.5}
}
.spinning .result-text{animation:pulse 0.5s ease-in-out infinite}
</style>
</head>
<body>
<div class="container">
  <h1>🎡 Crypto Spin</h1>
  <p class="sub">Putar roda & dapatkan hadiah crypto!</p>

  <div class="wheel-wrapper">
    <canvas id="wheelCanvas" width="600" height="600"></canvas>
    <div class="pointer"></div>
  </div>

  <div class="controls">
    <button class="btn btn-spin" id="spinBtn">🎰 Putar</button>
    <button class="btn btn-reset" id="resetBtn">↺ Reset</button>
  </div>

  <div class="result-box" id="resultBox">
    <div class="result-text" id="resultText">🔄 Siap spin?</div>
    <div class="result-sub" id="resultSub">Klik tombol atau tap roda</div>
  </div>

  <div class="history" id="history"></div>
</div>

<script>
// ===== DATA HADIAH CRYPTO =====
const prizes = [
  { label: '0.01 BTC', color: '#f7931a', icon: '₿' },
  { label: '0.1 ETH', color: '#627eea', icon: '⟠' },
  { label: '10 SOL', color: '#9945ff', icon: '◎' },
  { label: '100 DOGE', color: '#c2a633', icon: '🐕' },
  { label: '1,000 PEPE', color: '#4caf50', icon: '🐸' },
  { label: '50 USDT', color: '#26a17b', icon: '💵' },
  { label: '🧧 Lucky', color: '#e74c3c', icon: '🧧' },
  { label: '💎 Gems', color: '#3498db', icon: '💎' }
];

// ===== SETUP CANVAS =====
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const segments = prizes.length;
const arcSize = (2 * Math.PI) / segments;
const radius = 280;

let currentAngle = 0;
let isSpinning = false;
let history = [];

// ===== DRAW WHEEL =====
function drawWheel(rotation) {
  ctx.clearRect(0, 0, 600, 600);
  
  for (let i = 0; i < segments; i++) {
    const startAngle = rotation + i * arcSize;
    const endAngle = startAngle + arcSize;
    const prize = prizes[i];
    
    // draw segment
    ctx.beginPath();
    ctx.moveTo(300, 300);
    ctx.arc(300, 300, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = prize.color;
    ctx.fill();
    ctx.strokeStyle = '#1a1f2e';
    ctx.lineWidth = 2;
    ctx.stroke();

    // draw text
    ctx.save();
    ctx.translate(300, 300);
    ctx.rotate(startAngle + arcSize / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 6;
    ctx.fillText(prize.icon + ' ' + prize.label, 190, 0);
    ctx.restore();
  }

  // center circle
  ctx.beginPath();
  ctx.arc(300, 300, 40, 0, 2 * Math.PI);
  ctx.fillStyle = '#111a24';
  ctx.fill();
  ctx.strokeStyle = '#f7931a';
  ctx.lineWidth = 3;
  ctx.stroke();
  
  ctx.fillStyle = '#f7931a';
  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'transparent';
  ctx.fillText('🎯', 300, 300);
}

// ===== GET RESULT =====
function getResult(rotation) {
  const normalized = ((rotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const segmentIndex = Math.floor(((2 * Math.PI - normalized) % (2 * Math.PI)) / arcSize);
  return segmentIndex % segments;
}

// ===== SPIN =====
function spin() {
  if (isSpinning) return;
  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('resultText').textContent = '🌀 Memutar...';
  document.getElementById('resultBox').classList.add('spinning');

  const extraSpins = 3 + Math.random() * 5;
  const targetAngle = currentAngle + extraSpins * 2 * Math.PI + (Math.random() * 2 * Math.PI);
  const duration = 4000 + Math.random() * 1500;
  const startAngle = currentAngle;
  const startTime = performance.now();

  function animate(time) {
    const elapsed = time - startTime;
    const progress = Math.min(elapsed / duration, 1);
    // easing: cubic-bezier
    const ease = 1 - Math.pow(1 - progress, 3);
    const current = startAngle + (targetAngle - startAngle) * ease;
    
    drawWheel(current);
    
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = targetAngle;
      const resultIndex = getResult(currentAngle);
      const prize = prizes[resultIndex];
      const resultText = `${prize.icon} ${prize.label}`;
      
      document.getElementById('resultText').textContent = resultText;
      document.getElementById('resultSub').textContent = `🎉 Selamat! Kamu mendapat ${prize.label}`;
      document.getElementById('resultBox').classList.remove('spinning');
      
      // history
      history.unshift(resultText);
      if (history.length > 10) history.pop();
      updateHistory();
      
      isSpinning = false;
      document.getElementById('spinBtn').disabled = false;
    }
  }
  requestAnimationFrame(animate);
}

// ===== UPDATE HISTORY =====
function updateHistory() {
  const container = document.getElementById('history');
  container.innerHTML = history.map(h => `<span>${h}</span>`).join('');
}

// ===== RESET =====
function reset() {
  if (isSpinning) return;
  currentAngle = 0;
  drawWheel(0);
  document.getElementById('resultText').textContent = '🔄 Siap spin?';
  document.getElementById('resultSub').textContent = 'Klik tombol atau tap roda';
  history = [];
  updateHistory();
}

// ===== CLICK/TAP EVENT =====
canvas.addEventListener('click', spin);
document.getElementById('spinBtn').addEventListener('click', spin);
document.getElementById('resetBtn').addEventListener('click', reset);

// ===== KEYBOARD =====
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); spin(); }
  if (e.key === 'r') reset();
});

// ===== DRAW INITIAL =====
drawWheel(0);
</script>
</body>
</html>
